<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Screen Share</title>
	<link rel="stylesheet" href="styles.css">
	<script type="module" src="index.js" defer></script>
</head>
<body>
	<video id="screenshare" autoplay playsinline muted hidden></video>

	<header>
		<div id="logged-in">
			<b id="account-name"></b>
			<button id="logout-button">Log out</button>
			<button id="open-start-runner-dialog">Open start menu</button>
		</div>
    </header>

	<main id="runner-list">
		<form id="start-runner-form">
			<select name="os" required>
				<option value="windows-latest">windows-latest</option>
				<option value="macos-latest">macos-latest</option>
				<option value="ubuntu-latest">ubuntu-latest</option>
			</select>

			<br />

			<button type="submit">Start</button>
		</form>

		<hr />
	</main>

	<template id="runner-list-entry">
		
	</template>
</body>
</html>
