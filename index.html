<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Screen Share</title>
	<link rel="stylesheet" href="styles.css">
	<script type="module" src="index.js" defer></script>
</head>
<body>
	<video id="screenshare" autoplay playsinline muted hidden></video>

	<header>
        <div id="logged-out" hidden>
			<button>
				<a href="https://github.com/login/oauth/authorize?client_id=Ov23lipwX2GRkJRc0FdF&prompt=select_account&scope=public_repo%20workflow">
					Log in
				</a>
			</button>
		</div>

		<div id="logged-in" hidden>
			<b id="account-name"></b>
			<button id="logout-button">Log out</button>
			<button id="open-start-runner-dialog">Open start menu</button>
		</div>
    </header>

	<dialog id="start-runner-dialog">
		<form id="start-runner-form" method="dialog">
			<select name="os" required>
				<option value="windows-latest">windows-latest</option>
				<option value="macos-latest">macos-latest</option>
				<option value="ubuntu-latest">ubuntu-latest</option>
			</select>

			<br />

			<button type="submit">Start</button>
			<button type="reset" id="close-start-runner-dialog">Close</button>
		</form>
	</dialog>

	<main id="runner-list">

	</main>

	<template id="runner-list-entry">
		
	</template>
</body>
</html>
