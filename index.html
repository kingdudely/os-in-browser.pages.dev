<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Screen Share</title>
	<link rel="stylesheet" href="styles.css">
	<script type="module" src="index.js" defer></script>
</head>
<body>
	<video id="screenshare" autoplay playsinline muted></video>

	<dialog id="main-dialog">
		<button id="login-button">Login with GitHub</button>

		<hr />

		<form id="start-runner">
			<select name="os" required>
				<option value="windows-latest">windows-latest</option>
				<option value="macos-latest">macos-latest</option>
				<option value="ubuntu-latest">ubuntu-latest</option>
			</select>

			<br />

			<button type="submit">BOOT</button>
		</form>
	</dialog>
</body>
</html>
